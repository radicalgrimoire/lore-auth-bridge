<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles":false}'>
  <title>{% block title %}{{ self.t("admin.app.title") }}{% endblock %}</title>
  <link rel="stylesheet" href="/admin/static/pico.min.css">
  <script src="/admin/static/htmx.min.js" defer></script>
</head>
<body hx-boost="true">
  <header class="container">
    <nav>
      <ul>
        <li><a href="/admin"{% if active == "dashboard" %} aria-current="page"{% endif %}><strong>{{ self.t("admin.app.title") }}</strong></a></li>
      </ul>
      <ul>
        <li><a href="/admin/repositories"{% if active == "repositories" %} aria-current="page"{% endif %}>{{ self.t("admin.nav.repositories") }}</a></li>
        <li><a href="/admin/users"{% if active == "users" %} aria-current="page"{% endif %}>{{ self.t("admin.nav.users") }}</a></li>
        <li><a href="/admin/groups"{% if active == "groups" %} aria-current="page"{% endif %}>{{ self.t("admin.nav.groups") }}</a></li>
        <li><a href="/admin/server-settings"{% if active == "server-settings" %} aria-current="page"{% else if active == "simulator" %} aria-current="true"{% endif %}>{{ self.t("admin.nav.server_settings") }}</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    {% if !flash.is_empty() %}
    <section aria-live="polite" class="flash">{{ flash }}</section>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
