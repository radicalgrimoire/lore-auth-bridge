<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles":false}'>
  <title>{% block title %}{{ self.t("admin.app.title") }}{% endblock %}</title>
  <link rel="stylesheet" href="/admin/static/pico.min.css">
  <link rel="stylesheet" href="/admin/static/admin.css">
  <script src="/admin/static/htmx.min.js" defer></script>
</head>
<body hx-boost="true">
  <header class="site-header">
    <strong class="site-title">{{ self.t("admin.app.title") }}</strong>
    <nav class="desktop-nav" aria-label='{{ self.t("admin.nav.primary") }}'>
      {% include "admin/navigation.html" %}
    </nav>
    <details class="mobile-nav">
      <summary>{{ self.t("admin.nav.menu") }}</summary>
      <nav aria-label='{{ self.t("admin.nav.primary") }}'>
        {% include "admin/navigation.html" %}
      </nav>
    </details>
  </header>
  <main class="container admin-main">
    {% if !flash.is_empty() %}
    <section aria-live="polite" class="flash">{{ flash }}</section>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
